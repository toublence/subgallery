name: SubGallery
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.14.0
options:
  bundleIdPrefix: com.namslab
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2CZQR7Q423
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.1
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  SubGallery:
    build:
      targets:
        SubGallery: all
    run:
      config: Debug
      language: ko
      region: KR
    test:
      config: Debug
      targets:
        - SubGalleryTests
        - SubGalleryUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SubGallery-StoreKit:
    build:
      targets:
        SubGallery: all
    run:
      config: Debug
      language: ko
      region: KR
      storeKitConfiguration: StoreKit/Products.storekit
    test:
      config: Debug
      targets:
        - SubGalleryTests
    analyze:
      config: Debug
targets:
  SubGallery:
    type: application
    platform: iOS
    sources:
      - path: SubGallery
      - path: GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namslab.subgallery
        PRODUCT_NAME: SubGallery
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: SubGallery/Resources/Info.plist
      properties:
        CFBundleDisplayName: SubGallery
        # Referenced, not hardcoded: without these the generated plist carries a
        # literal 1.0 that silently wins over the version set in Xcode.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ko
          - de
          - es
          - fr
          - ja
          - ar
          - zh-Hans
          - zh-Hant
        LSApplicationCategoryType: public.app-category.photo-video
        NSPhotoLibraryAddUsageDescription: 내보내기를 선택한 항목만 사진 앱에 저장합니다.
        NSCameraUsageDescription: 사진과 동영상을 SubGallery에 촬영하기 위해 카메라를 사용합니다.
        NSMicrophoneUsageDescription: 동영상에 소리를 녹음할 때 마이크를 사용합니다.
        NSLocationWhenInUseUsageDescription: 사용자가 켠 경우 촬영 위치를 사진 정보에 기록합니다.
        NSUserTrackingUsageDescription: 광고 성과를 측정하고 더 관련성 높은 광고를 제공하기 위해 기기 식별자 사용을 요청합니다.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.namslab.subgallery
            CFBundleURLSchemes:
              - subgallery
    entitlements:
      path: SubGallery/Resources/SubGallery.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.namslab.subgallery
        com.apple.developer.icloud-services:
          - CloudKit
  SubGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SubGalleryTests
    dependencies:
      - target: SubGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namslab.subgallery.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SubGallery.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SubGallery"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SubGalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SubGalleryUITests
    dependencies:
      - target: SubGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namslab.subgallery.uitests
        GENERATE_INFOPLIST_FILE: true
